name: Publish homepage

# Automatic runs are enabled after the initial preview and upload are verified.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/deploy-homepage.sh
      - scripts/stamp-site.mjs
      - scripts/stamp-site.test.mjs
      - .github/workflows/deploy-homepage.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the upload without changing the server
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: homepage-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.HOMEPAGE_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the homepage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check website update timestamps
        run: node --test scripts/stamp-site.test.mjs
      - name: Stamp the website update time
        run: node scripts/stamp-site.mjs
      - name: Publish homepage files
        env:
          HOMEPAGE_SSH_HOST: ${{ vars.HOMEPAGE_SSH_HOST }}
          HOMEPAGE_SSH_PORT: ${{ vars.HOMEPAGE_SSH_PORT }}
          HOMEPAGE_SSH_USER: ${{ vars.HOMEPAGE_SSH_USER }}
          HOMEPAGE_DIRECTORY: ${{ vars.HOMEPAGE_DIRECTORY }}
          HOMEPAGE_SSH_KEY: ${{ secrets.HOMEPAGE_SSH_KEY }}
          HOMEPAGE_KNOWN_HOSTS: ${{ secrets.HOMEPAGE_KNOWN_HOSTS }}
          HOMEPAGE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: bash scripts/deploy-homepage.sh
